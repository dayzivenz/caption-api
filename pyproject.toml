# CaptionAPI
# AI-powered image caption generator for training datasets
# FastAPI + deployable anywhere

[project]
name = "caption-api"
version = "1.0.0"
description = "Generate high-quality captions for AI training datasets"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/caption-api"
